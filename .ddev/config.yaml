name: craft-parts-kit
type: craftcms
docroot: craft-install/web
php_version: "8.3"
webserver_type: nginx-fpm
xdebug_enabled: false
additional_hostnames: []
additional_fqdns: []
database:
  type: mariadb
  version: "10.11"
use_dns_when_possible: true
composer_version: "2"
web_environment: []
composer_root: "." # Forces ddev composer install to run in root (for plugin) vs. the craft-install directory (default behavior)
corepack_enable: false
